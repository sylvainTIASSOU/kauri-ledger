[package]
name = "kauri-ledger-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kauri-ledger-core = { path = "../kauri-ledger-core" }

sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1.54", features = ["full", "test-util"] }
