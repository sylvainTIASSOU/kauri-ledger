[package]
name = "kauri-ledger-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true


[[bin]]
name = "kauri-ledger"
path = "src/bin/main.rs"

[lib]
name = "kauri_ledger_api"
path = "src/lib.rs"


[dependencies]
kauri-ledger-core = { path = "../kauri-ledger-core" }
kauri-ledger-store = { path = "../kauri-ledger-store" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
console = "0.16.6"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "10.0.2", features = [
    "axum",
    "minified",
    "gzip",
] }
tower-http = { version = "0.7.1", features = ["request-id", "trace"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }


[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
