[package]
name = "kauri-ledger-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kauri-cli"
path = "src/main.rs"

[dependencies]
kauri-ledger-core = { path = "../kauri-ledger-core" }
kauri-ledger-store = { path = "../kauri-ledger-store" }

clap = { version = "4.6.9", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }


[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1.54", features = ["full", "test-util"] }
