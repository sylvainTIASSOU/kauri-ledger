[workspace]
resolver = "2"
members = [
    "crates/kauri-ledger-core",
    "crates/kauri-ledger-store",
    "crates/kauri-ledger-api",
    "crates/kauri-ledger-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sylvainTIASSOU/kauri-ledger"
description = "A reliable, open-source double-entry ledger engine optimized for UEMOA (XOF, Mobile Money)."
