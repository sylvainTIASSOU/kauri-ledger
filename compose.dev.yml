name: kauri-ledger-dev

services:
  postgres:
    build:
      context: .
      dockerfile: ops/dev/postgres/Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ledger_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
      LEDGER_HTTP_PASSWORD: ${LEDGER_HTTP_PASSWORD:?Set LEDGER_HTTP_PASSWORD in .env.dev}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d ledger_dev
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    stop_grace_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9.19

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env.dev}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  pgadmin_data: